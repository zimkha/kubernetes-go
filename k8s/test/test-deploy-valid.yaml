apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-dev
  namespace: dev
  labels:
    env: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
        env: dev
    spec:
      containers:
        - name: nginx
          image: nginx:1.27
